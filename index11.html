<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HERspace — Your space. Your health. Your choices.</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
         :root {
            --blush: #F7E8EE;
            --cream: #FFF9F3;
            --lav: #E9E2F5;
            --sage: #DCE9DD;
            --plum: #3E1F47;
            --mut: #7A6580;
            --card: #fff;
            --line: #eddde5;
            --acc: #8B4A7A;
            --acc2: #F3D3E1;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light
        }
        
        @media (prefers-color-scheme:dark) {
             :root:not([data-theme="light"]) {
                --blush: #3a2335;
                --cream: #1f1521;
                --lav: #332a47;
                --sage: #26352b;
                --plum: #f5e6ef;
                --mut: #bba6c2;
                --card: #2a1d2d;
                --line: #41304a;
                --acc: #e4a8cf;
                --acc2: #4a2d44;
                color-scheme: dark
            }
        }
        
         :root[data-theme="dark"] {
            --blush: #3a2335;
            --cream: #1f1521;
            --lav: #332a47;
            --sage: #26352b;
            --plum: #f5e6ef;
            --mut: #bba6c2;
            --card: #2a1d2d;
            --line: #41304a;
            --acc: #e4a8cf;
            --acc2: #4a2d44;
            color-scheme: dark
        }
        
        * {
            box-sizing: border-box
        }
        
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }
        
        body {
            margin: 0;
            background: var(--cream);
            color: var(--plum);
            font: 15px/1.55 Inter, system-ui, sans-serif
        }
        
        h1,
        h2,
        h3,
        .serif {
            font-family: Fraunces, Georgia, serif;
            font-weight: 400;
            margin: 0;
            letter-spacing: -.01em
        }
        
        button {
            font: inherit;
            color: inherit;
            cursor: pointer;
            border: 0;
            background: none
        }
        
        .app {
            display: flex;
            min-height: 100vh
        }
        
        nav {
            position: fixed;
            z-index: 20;
            background: var(--card);
            border-top: 1px solid var(--line);
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px))
        }
        
        nav .logo {
            display: none
        }
        
        nav button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: var(--mut);
            padding: 6px 8px;
            border-radius: 14px;
            flex: 1
        }
        
        nav button span {
            font-size: 19px
        }
        
        nav button.on {
            color: var(--acc);
            font-weight: 600;
            background: var(--blush)
        }
        
        main {
            flex: 1;
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 18px 110px
        }
        
        @media(min-width:800px) {
            nav {
                top: 0;
                bottom: auto;
                right: auto;
                width: 220px;
                flex-direction: column;
                justify-content: flex-start;
                gap: 6px;
                border-top: 0;
                border-right: 1px solid var(--line);
                padding: 28px 14px;
                height: 100vh
            }
            nav .logo {
                display: block;
                margin: 0 10px 22px
            }
            nav button {
                flex-direction: row;
                gap: 12px;
                font-size: 14px;
                padding: 11px 14px;
                flex: 0;
                justify-content: flex-start
            }
            main {
                margin-left: 220px;
                max-width: none;
                padding: 36px 44px 60px
            }
            .app>main {
                max-width: 1100px
            }
        }
        
        .logo b {
            font: 600 26px Fraunces, serif;
            display: block
        }
        
        .logo i {
            font-size: 11px;
            color: var(--mut);
            font-style: normal
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 18px
        }
        
        .grid {
            display: grid;
            gap: 14px
        }
        
        .g2 {
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr))
        }
        
        .g3 {
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr))
        }
        
        .hero {
            background: linear-gradient(135deg, var(--blush), var(--lav));
            border-radius: 28px;
            padding: 26px;
            margin-bottom: 14px
        }
        
        .hero h1 {
            font-size: clamp(28px, 5vw, 40px);
            line-height: 1.15
        }
        
        .mut {
            color: var(--mut)
        }
        
        .sm {
            font-size: 12.5px
        }
        
        .btn {
            background: var(--plum);
            color: var(--cream);
            padding: 11px 20px;
            border-radius: 999px;
            font-weight: 500
        }
        
        .btn.ghost {
            background: var(--acc2);
            color: var(--plum)
        }
        
        .btn.sm {
            padding: 7px 14px;
            font-size: 13px
        }
        
        h2 {
            font-size: 24px;
            margin: 22px 0 12px
        }
        
        .chip {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--line);
            margin: 3px 4px 3px 0;
            font-size: 13.5px
        }
        
        .chip.on {
            background: var(--plum);
            color: var(--cream);
            border-color: var(--plum)
        }
        
        .tile {
            height: 130px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: grid;
            place-items: center;
            font-size: 58px
        }
        
        .tile:before,
        .tile:after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .4)
        }
        
        .tile:before {
            width: 150px;
            height: 150px;
            right: -40px;
            top: -50px
        }
        
        .tile:after {
            width: 90px;
            height: 90px;
            left: -25px;
            bottom: -35px
        }
        
        .tile span {
            position: relative;
            filter: drop-shadow(0 6px 8px rgba(62, 31, 71, .25))
        }
        /* position:relative lets the ♡ heart button sit in the card's corner */
        
        .meal {
            position: relative;
            cursor: pointer;
            padding: 12px;
            transition: transform .15s
        }
        
        .meal:hover {
            transform: translateY(-3px)
        }
        
        .meal h3 {
            font-size: 18px;
            margin: 10px 0 2px
        }
        
        .tag {
            font-size: 11px;
            background: var(--sage);
            color: #2f4a35;
            border-radius: 99px;
            padding: 2px 9px;
            margin-right: 4px
        }
        
        @media(prefers-color-scheme:dark) {
            .tag {
                color: #cfe6d3
            }
        }
        
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap
        }
        
        .bar {
            height: 8px;
            background: var(--line);
            border-radius: 9px;
            overflow: hidden;
            margin: 5px 0 12px
        }
        
        .bar i {
            display: block;
            height: 100%;
            background: var(--acc);
            border-radius: 9px
        }
        
        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px
        }
        
        .tabs .chip {
            white-space: nowrap
        }
        
        .slot {
            font: 600 11px Inter;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--acc);
            margin: 18px 0 8px
        }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(40, 16, 48, .5);
            z-index: 50;
            display: flex;
            align-items: flex-end;
            justify-content: center
        }
        
        .modal .sheet {
            background: var(--cream);
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow: auto;
            border-radius: 28px 28px 0 0;
            padding: 18px;
            padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px))
        }
        
        @media(min-width:800px) {
            .modal {
                align-items: center
            }
            .modal .sheet {
                border-radius: 28px
            }
        }
        
        .sheet ol,
        .sheet ul {
            padding-left: 20px;
            margin: 6px 0
        }
        
        .chat {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 330px);
            min-height: 380px
        }
        
        .msgs {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px
        }
        
        .m {
            max-width: 85%;
            padding: 11px 15px;
            border-radius: 20px;
            white-space: pre-wrap
        }
        
        .m.u {
            align-self: flex-end;
            background: var(--plum);
            color: var(--cream);
            border-bottom-right-radius: 6px
        }
        
        .m.a {
            background: var(--lav);
            border-bottom-left-radius: 6px
        }
        
        .inp {
            display: flex;
            gap: 8px;
            margin-top: 10px
        }
        
        input[type=text],
        textarea {
            flex: 1;
            font: inherit;
            color: var(--plum);
            padding: 12px 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            width: 100%
        }
        
        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center
        }
        
        .cal button {
            aspect-ratio: 1;
            border-radius: 14px;
            background: var(--blush);
            font-size: 13px
        }
        
        .cal button.p {
            background: #c4507f;
            color: #fff
        }
        
        .cal button.t {
            outline: 2px solid var(--plum)
        }
        /* predicted period day: dashed outline instead of a fill */
        
        .cal button.pr {
            background: transparent;
            border: 2px dashed #c4507f;
            color: var(--plum)
        }
        /* future days can't be logged */
        
        .cal button:disabled {
            cursor: default;
            color: var(--mut)
        }
        /* small coloured squares in the calendar legend */
        
        .lg {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            vertical-align: -1px;
            margin: 0 5px 0 10px;
            background: var(--blush)
        }
        
        .lg:first-child {
            margin-left: 0
        }
        
        .lg.p {
            background: #c4507f
        }
        
        .lg.pr {
            background: transparent;
            border: 2px dashed #c4507f
        }
        
        .lg.t {
            outline: 2px solid var(--plum)
        }
        /* the three period stats (cycle length, period length, periods logged) */
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 14px
        }
        
        .stats div {
            background: var(--blush);
            border-radius: 16px;
            padding: 10px;
            text-align: center
        }
        
        .stats b {
            display: block;
            font: 600 22px Fraunces, serif
        }
        
        .cal button {
            position: relative
        }
        /* selected day (the one being edited below the calendar) */
        
        .cal button.s {
            box-shadow: 0 0 0 3px var(--acc)
        }
        /* small dot = mood or symptoms saved for that day */
        
        .cal button.l:after {
            content: "";
            position: absolute;
            bottom: 4px;
            left: 50%;
            width: 5px;
            height: 5px;
            margin-left: -2.5px;
            border-radius: 50%;
            background: var(--acc)
        }
        
        .cal button.p.l:after {
            background: #fff
        }
        
        .lg.l {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--acc);
            vertical-align: 1px
        }
        /* panel for the selected day: period toggle, mood, symptoms */
        
        .dayp {
            background: var(--blush);
            border-radius: 20px;
            padding: 14px;
            margin-top: 14px
        }
        /* ♡ / ♥ save button in the corner of recipe cards */
        
        .heart {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--card);
            color: #c4507f;
            font-size: 19px;
            box-shadow: 0 2px 8px rgba(62, 31, 71, .18)
        }
        
        .cal b {
            font-size: 11px;
            color: var(--mut)
        }
        
        .ob {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: linear-gradient(160deg, var(--blush), var(--cream) 50%, var(--lav));
            overflow: auto;
            display: grid;
            place-items: center;
            padding: 20px
        }
        
        .ob .box {
            max-width: 520px;
            width: 100%
        }
        
        .dots {
            display: flex;
            gap: 6px;
            margin-bottom: 22px
        }
        
        .dots i {
            height: 4px;
            flex: 1;
            border-radius: 4px;
            background: var(--line)
        }
        
        .dots i.on {
            background: var(--plum)
        }
        
        .ob h1 {
            font-size: 32px;
            margin-bottom: 8px
        }
        
        .ob .opts {
            margin: 18px 0
        }
        
        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 90px;
            background: var(--plum);
            color: var(--cream);
            padding: 10px 18px;
            border-radius: 99px;
            z-index: 70;
            font-size: 13px
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>
        // ===================== HELPERS =====================
        // $ — shortcut for document.querySelector: $("#q") returns the first element matching the CSS selector.
        const $ = s => document.querySelector(s);
        // esc — "escape" text before putting it into HTML. Turns & < > " into safe entities so that
        // anything a user types (name, dislikes, chat messages) is shown as text and can't inject HTML.
        const esc = s => String(s).replace(/[&<>"]/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;"
        }[c]));
        // ===================== FIXED OPTION LISTS =====================
        // DIETS — the four eating styles the user can choose (onboarding step 2 and My Health page).
        const DIETS = ["Vegan", "Vegetarian", "Non-vegetarian", "Pescatarian"],
            // AL — the allergens the user can tick. Any meal whose `a` list contains one of these is hidden.
            AL = ["Nuts", "Dairy", "Gluten", "Soy", "Eggs", "Fish", "Sesame"];

        // ===================== APP STATE =====================
        // S — "State": one object holding everything the app remembers about the user.
        // It is saved to the browser (localStorage) after every change, and the screen is
        // rebuilt from it by render(). Change S, call render(), and the page updates.
        let S = {
            onb: false, // onboarding finished? false = show the welcome questions
            step: 0, // which onboarding question is showing (0 = name … 3 = dislikes)
            name: "", // the user's first name, used in greetings
            diet: "Non-vegetarian", // chosen diet; decides which meals are allowed (see lvl below)
            al: [], // allergies the user ticked, e.g. ["Nuts","Soy"]
            dis: "", // foods the user dislikes, typed as text, e.g. "mushrooms, olives"
            cook: "30 min", // cooking time preference (no longer asked; kept as a default)
            skill: "Home cook", // cooking skill (no longer asked; kept as a default)
            plan: { // today's chosen meal id for each slot (0 = use the first suitable meal)
                breakfast: 0,
                lunch: 0,
                dinner: 0,
                snack: 0
            },
            saved: [], // ids of recipes the user tapped "♡ Save" on
            period: [], // every logged period day, as "YYYY-MM-DD" strings (all months, kept between visits)
            log: {}, // mood & symptoms per day: { "2026-11-07": {mood:"😌 Calm", sym:["Cramps"]}, … }
            cycleLen: 0, // usual cycle length in days, from setup (0 = not given → 28)
            periodLen: 0, // usual period length in days, from setup (0 = not given → 5)
            irregular: false, // user said their cycle is irregular / not sure
            water: 2, // glasses of water logged today
            tab: "Seeds", // which Food library tab is open
            chat: [], // Ask HER AI messages: {r:"u"|"a", t:"text"} (u = user, a = assistant)
            ptab: "today", // which Planner tab is open: "today", "week" or "shop"
            day: "Mon", // which day is selected in the "My week" planner
            week: {}, // weekly plan: { Mon: {breakfast: id, lunch: id, …}, Tue: {…}, … }
            got: [] // grocery items ticked off as bought
                // (S.dpick is added below: true once the user has actually tapped a diet in onboarding)
        };
        // Load the previously saved state from the browser, if there is one, and merge it into S.
        // x — the raw saved JSON text. Wrapped in try/catch because storage can be blocked (e.g. private mode).
        try {
            const x = localStorage.getItem("hs");
            if (x) S = Object.assign(S, JSON.parse(x))
        } catch (e) {}
        // Ask the onboarding questions again on every page load:
        // wipe the profile answers (name, diet, allergies, dislikes) and the chat,
        // but keep things like saved recipes, period days and the weekly plan.
        S.onb = false;
        S.step = 0;
        S.name = "";
        S.dpick = false;
        S.diet = "Non-vegetarian";
        S.al = [];
        S.dis = "";
        S.chat = [];
        // save — writes S to the browser's localStorage under the key "hs" (HERspace). Called by render().
        const save = () => {
            try {
                localStorage.setItem("hs", JSON.stringify(S))
            } catch (e) {}
        };
        // lvl — turns a diet into a number so meals can be compared against it.
        // A meal with level l is allowed when l <= the user's level. So a vegan user (0)
        // only sees l:0 meals, while a non-vegetarian user (3) sees everything.
        const lvl = {
            Vegan: 0,
            Vegetarian: 1,
            Pescatarian: 2,
            "Non-vegetarian": 3
        };
        // ===================== MEAL DATA =====================
        // M — "Meals": every recipe in the app. Each meal object uses short keys:
        //   id  unique number (used by plan, saved, week)
        //   s   slot: "breakfast" | "lunch" | "dinner" | "snack"
        //   n   name shown on cards
        //   e   emoji shown on the coloured tile
        //   h   spare number (not used anywhere on screen)
        //   k   calories (kcal)      p  protein (g)
        //   i   iron (mg)            f  fiber (g)
        //   t   time to make, as text
        //   l   lowest diet that can eat it: 0 vegan, 1 vegetarian, 2 pescatarian, 3 non-veg
        //   a   allergens it contains; hidden for anyone who ticked one of them
        //   c   two colours for the tile's background gradient
        //   tg  little green tags under the card ("Iron", "Fiber"…)
        //   ing ingredient lines (also scanned to build the grocery list)
        //   st  preparation steps
        const M = [
            // ---------- BREAKFAST ----------
            {
                id: 1,
                s: "breakfast",
                n: "Berry chia pudding",
                e: "🫐",
                h: 330,
                k: 340,
                p: 12,
                i: 4,
                f: 14,
                t: "5 min + overnight",
                l: 0,
                a: [],
                c: "#e7c6df,#cfc1ec",
                tg: ["Fiber", "Omega-3"],
                ing: ["3 tbsp chia seeds", "1 cup oat or soy-free plant milk", "1 cup mixed berries", "1 tsp maple syrup", "1 tbsp pumpkin seeds"],
                st: ["Stir chia, milk and syrup; rest 10 minutes and stir again.", "Chill overnight.", "Top with berries and pumpkin seeds."]
            }, {
                id: 2,
                s: "breakfast",
                n: "Spinach & feta egg muffins",
                e: "🥚",
                h: 50,
                k: 310,
                p: 22,
                i: 3.4,
                f: 3,
                t: "25 min",
                l: 1,
                a: ["Eggs", "Dairy"],
                c: "#f7dcb5,#dfe9c9",
                tg: ["Protein", "Iron"],
                ing: ["6 eggs", "2 cups spinach, chopped", "60 g feta", "½ red pepper, diced", "Pinch of pepper"],
                st: ["Heat oven to 180°C and grease a 6-cup muffin tin.", "Whisk eggs, fold in spinach, feta and pepper.", "Fill cups and bake 18–20 minutes."]
            }, {
                id: 3,
                s: "breakfast",
                n: "Pumpkin seed oat bowl",
                e: "🥣",
                h: 30,
                k: 390,
                p: 15,
                i: 5.1,
                f: 9,
                t: "10 min",
                l: 0,
                a: ["Gluten"],
                c: "#f3dcc4,#e9e2f5",
                tg: ["Iron", "Magnesium"],
                ing: ["½ cup rolled oats", "1 cup water or plant milk", "2 tbsp pumpkin seeds", "1 banana, sliced", "Cinnamon"],
                st: ["Simmer oats 5 minutes until creamy.", "Top with banana, seeds and cinnamon."]
            }, {
                id: 13,
                s: "breakfast",
                n: "Quinoa berry overnight oats",
                e: "🍓",
                h: 60,
                k: 380,
                p: 14,
                i: 4.2,
                f: 11,
                t: "10 min + overnight",
                l: 0,
                a: ["Gluten"],
                c: "#f4cfe0,#e9e2f5",
                tg: ["Low GI", "Fiber"],
                ing: ["½ cup rolled oats", "¼ cup cooked quinoa", "1 cup plant milk", "1 tbsp chia seeds", "1 tbsp sunflower seed butter", "½ cup raspberries", "Cinnamon"],
                st: ["Stir oats, quinoa, plant milk, chia and cinnamon together in a jar.", "Refrigerate overnight (keeps 3 days, so make a few).", "Top with raspberries and a swirl of sunflower seed butter."]
            }, {
                id: 14,
                s: "breakfast",
                n: "Cottage cheese egg bites",
                e: "🫑",
                h: 55,
                k: 290,
                p: 26,
                i: 2.1,
                f: 2,
                t: "30 min",
                l: 1,
                a: ["Eggs", "Dairy"],
                c: "#f7e3b8,#f7e8ee",
                tg: ["Protein", "Meal prep"],
                ing: ["6 eggs", "½ cup cottage cheese", "½ red pepper, diced", "1 cup spinach, chopped", "30 g feta", "Pinch of pepper"],
                st: ["Heat oven to 160°C and grease a muffin tin.", "Blend eggs and cottage cheese until smooth.", "Divide pepper, spinach and feta between cups, pour egg mix over.", "Bake 22–25 minutes until just set. Keeps 4 days in the fridge."]
            }, {
                id: 15,
                s: "breakfast",
                n: "Turkey & sweet potato hash",

                ["Healthy fat + leafy greens", "🥑", "Fats unlock vitamins A, E and K."],

        // ===================== "HER AI" CHAT =====================
        // (This is a simple rule-based helper, not a real AI model.)

            spinach: ["Garlic spinach & white bean sauté", "🥬", 0, [], "Sauté garlic, wilt spinach, fold in beans and a squeeze of lemon."],
            egg: ["Soft scramble on toast", "🍳", 1, ["Eggs"], "Whisk eggs, cook low and slow with butter or oil, serve on toast with greens."],

            quinoa: ["Herby quinoa bowl", "🌾", 0, [], "Toss cooked quinoa with herbs, olive oil, lemon and whatever veg you have."],
            avocado: ["Smashed avocado toast", "🥑", 0, ["Gluten"], "Mash avocado with lemon and salt, top with seeds."],
            banana: ["Banana & seed pancakes", "🍌", 1, ["Eggs"], "Mash banana with egg and oats, cook in a pan."],
            yogurt: ["Yogurt seed parfait", "🥛", 1, ["Dairy"], "Layer yogurt, fruit and seeds."],
            rice: ["Veggie fried rice", "🍚", 0, ["Eggs"], "Stir-fry cold rice with vegetables and tamari."],
            "sweet potato": ["Stuffed sweet potato", "🍠", 0, [], "Bake whole at 200°C for 45 minutes; fill with beans and tahini."],
            broccoli: ["Garlic broccoli & seeds", "🥦", 0, [], "Roast at 220°C for 15 minutes with oil and lemon."]
        };
        // Q — "Questions": [pattern, answer] pairs. If the message matches the pattern
        // (e.g. mentions "iron" or "tired"), that canned answer is sent back.
        const Q = [
            [/iron|tired|fatigue|anaemi|anemi/, "Iron: pair plant sources (lentils, spinach, tofu, pumpkin seeds) with vitamin C like lemon or peppers. Keep tea and coffee an hour away from iron-rich meals. Around your period, add an extra serving daily. If fatigue persists, ask for a ferritin test."],
            [/protein/, "Aim for roughly 20–30 g per meal. Easy wins: Greek yogurt, eggs, lentils, tofu, salmon, edamame and hemp seeds."],
            [/fib(er|re)|constipat|digest/, "Build up fiber gradually to 25–30 g/day: chia, oats, berries, beans and pears. Drink more water as you increase fiber."],
            [/seed/, "Seeds you’ll love: pumpkin (iron, zinc), ground flax (lignans), chia (fiber, omega-3), sesame (calcium) and hemp (protein). A tablespoon or two daily is plenty."],
            [/cramp|period|pms|menstru/, "Around your period: magnesium (dark chocolate, pumpkin seeds), omega-3 (salmon, chia), ginger tea and iron-rich meals can all help. Limit very salty foods if you’re bloated."],

        //   3. matches a topic in Q → that answer,
        //   4. otherwise → a help message.
        function reply(t) {

            }

        };

        function setPeriodLen(n) {
            S.periodLen = n;

            if (!c) return;
            const latest = c.periods[c.periods.length - 1];

                length: n
            }, (_, i) => addDays(latest.start, i));

            });

        // cycle() — reads all logged period days (past and future) and works out what the tracker shows.
        // Returns null if nothing is logged yet, otherwise an object with:
        //   periods   — each period as {start, end, len}, oldest first
        //   gaps      — cycle lengths: days from each period's start to the next one's start
        //   avgCycle  — cycle length used for predictions = the "Cycle length" box (S.cycleLen)
        //   avgLen    — period length used for predictions = the "Period length" box (S.periodLen)
        //   logCycle  — the average cycle length from the user's own logs (null until 2 periods are logged)
        //   logLen    — the average length of finished logged periods (null if none yet)
        //   next      — next period start: a period logged ahead of time, otherwise last start + avgCycle
        //   day       — today's day of the cycle (day 1 = first day of the latest period so far), or null
        //   predicted — predicted period days for the next 3 cycles (shown dashed on the calendar)
        function cycle() {
            // days — every logged day, oldest first.
            const days = [...S.period].sort();
            if (!days.length) return null;
            // Group days into periods. A gap of more than 2 days starts a new period, so forgetting
            // to log one day in the middle doesn't split a period in two.
            const periods = [];
            days.forEach(d => {
                const last = periods[periods.length - 1];
                if (last && daysBetween(last.end, d) <= 2) last.end = d;
                else periods.push({
                    start: d,
                    end: d
                });
            });
            periods.forEach(p => p.len = daysBetween(p.start, p.end) + 1);
            // gaps — days between consecutive period starts.
            const gaps = periods.slice(1).map((p, i) => daysBetween(periods[i].start, p.start));
            // usable — gaps between 15 and 60 days. Shorter/longer ones are probably a logging mistake
            // or a missed month, so they're left out of the average.
            const usable = gaps.filter(g => g >= 15 && g <= 60);
            // avg(list) — the mean of a list of numbers.
            const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
            // Average only the last 6 cycles so predictions follow recent changes.
            const logCycle = usable.length ? Math.round(avg(usable.slice(-6))) : null;
            // The boxes on My Health are what the calendar follows, so editing them updates it instantly.
            const avgCycle = usualCycle();
            // done — past periods that have finished (nothing logged yesterday or today) and are longer
            // than one day (a single tapped day is usually just the start, not the whole period).
            const done = periods.filter(p => daysBetween(p.end, TODAY) > 1 && p.len > 1);
            const logLen = done.length ? Math.round(avg(done.slice(-6).map(p => p.len))) : null;
            const avgLen = usualLen();
            // past — periods that have started by today. upcoming — the first one logged for a future date.
            const past = periods.filter(p => p.start <= TODAY);
            const upcoming = periods.find(p => p.start > TODAY);
            // lastStart — start of the most recent period so far (null if only future days are logged).
            const lastStart = past.length ? past[past.length - 1].start : null;
            // latest — the newest logged start, future ones included; predictions continue from it.
            const latest = periods[periods.length - 1].start;
            const predicted = [];
            for (let c = 1; c <= 3; c++)
                for (let i = 0; i < avgLen; i++) predicted.push(addDays(latest, avgCycle * c + i));
            return {
                periods,
                gaps,
                avgCycle,
                avgLen,
                logCycle,
                logLen,
                next: upcoming ? upcoming.start : addDays(lastStart, avgCycle),
                day: lastStart ? daysBetween(lastStart, TODAY) + 1 : null,
                predicted
            };
        }

        // before the next period, so the phases stretch or shrink to fit the user's own cycle length.
        // Returns [phase name, food tip], or null if no period is logged yet.
        function phase() {
            const c = cycle();
            if (!c || !c.day) return null;
            // d — today's cycle day. ov — estimated ovulation day.
            const d = c.day,
                ov = c.avgCycle - 14;
            return d <= c.avgLen ? ["Menstrual", "Prioritize iron, vitamin C, warm soups and ginger."] : d < ov - 1 ? ["Follicular", "Light, fresh foods, flax and sprouted seeds support rising energy."] : d <= ov + 1 ? ["Ovulatory", "Fiber, leafy greens and antioxidant-rich berries."] : ["Luteal", "Magnesium and complex carbs: pumpkin seeds, sweet potato, dark chocolate."]
        }

        const V = {};
        // V.home — the Home page.
        //   ms — today's four meals.
        //   T  — totals of today's meals: k calories, p protein, i iron, f fiber.
        //   ph — current cycle phase from phase() (or null).
        //   cy — period stats from cycle() (or null), for the next-period prediction.
        //   nb(name, value, goal, unit) — draws one "nutrition bar": label, "value / goal", and a filled bar.
        //   The goals used are 1900 kcal, 70 g protein, 18 mg iron, 28 g fiber per day.
        V.home = () => {
                const ms = todays(),
                    T = ms.reduce((a, m) => ({
                        k: a.k + m.k,
                        p: a.p + m.p,
                        i: a.i + m.i,
                        f: a.f + m.f
                    }), {

                        p: 0,
                        i: 0,
                        f: 0
                    }),

                    cy = cycle(); // period stats, used for the "Next period …" line
                const nb = (n, v, g, u) => `<div class="sm row"><span>${n}</span><span class="mut">${Math.round(v)} / ${g}${u}</span></div><div class="bar"><i style="width:${Math.min(100,v/g*100)}%"></i></div>`;
                return `<div class="hero"><div class="sm mut">${today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div><h1>Good day, ${esc(S.name||"love")}.</h1><p class="mut" style="max-width:480px">Today’s plan: ${ms.length} meals, gently tailored to your ${S.diet.toLowerCase()} preferences.</p><button class="btn" data-go="ai">✨ Ask HER AI</button></div>
 <div class="grid g2"><div class="card"><h3>Daily nutrition</h3><p class="sm mut">Planned for today</p>${nb("Calories",T.k,1900," kcal")}${nb("Protein",T.p,70," g")}${nb("Iron",T.i,18," mg")}${nb("Fiber",T.f,28," g")}</div>
 <div class="card" style="background:var(--sage)"><h3>Today’s wellness</h3><p class="sm">💧 Water: ${S.water}/8 glasses</p><div class="row" style="justify-content:flex-start"><button class="btn sm" data-a="water">+ Glass</button><button class="btn ghost sm" data-a="waterm">−</button></div><p class="sm" style="margin-top:12px">How’s your mood? <span class="mut">(saved to today in your period tracker)</span></p>${MOODS.map(x=>`<button class="chip ${(S.log[TODAY]||{}).mood===x?"on":""}" data-a="mood" data-d="${TODAY}" data-v="${x}">${x}</button>`).join("")}<p class="sm" style="margin-top:10px">🌸 ${ph?`${ph[0]} phase — ${ph[1]}`:"Log your period in My Health for phase-aware tips."}${cy?` <b>Next period ${until(cy.next)}.</b>`:""}</p></div></div>

// card(m) — HTML for a clickable meal card (tile, name, slot, time, calories, tags). Tapping it opens the recipe.

//         optional) and #irr (irregular checkbox), prefilled with any earlier answers.
// To add or remove a question: edit B, change tot, and change the last-step number in the "next" handler.
function onb(){if(!S.name)S.step=0;const st=S.step,tot=5,opt=(a,v,on)=>`<button class="chip ${on?"on":""}" data-a="${a}" data-v="${v}">${v}</button>`;
 const B=[`<h1>Welcome to HERspace</h1><p class="mut">Your space. Your health. Your choices.<br>First things first: what’s your name?</p><div class="opts"><input type="text" id="nm" placeholder="Type your first name" value="${esc(S.name)}" autocomplete="given-name"></div>`,
 `<h1>Are you vegan, vegetarian, non-vegetarian or pescatarian?</h1><p class="mut">Pick the one that fits you best.</p><div class="opts">${DIETS.map(d=>opt("diet",d,S.dpick&&S.diet===d)).join("")}</div>`,
 `<h1>Any allergies?</h1><p class="mut">We’ll never suggest these.</p><div class="opts">${AL.map(d=>opt("al",d,S.al.includes(d))).join("")}</div>`,
 `<h1>Foods you dislike?</h1><div class="opts"><input type="text" id="dl" placeholder="e.g. mushrooms, olives" value="${esc(S.dis)}"></div>`,
 `<h1>Tell us about your cycle</h1><p class="mut">This lets us predict your next period. Your own logs will fine-tune it over time.</p><div class="opts">
 <p class="sm" style="margin:0 0 6px">How long is your cycle usually? <span class="mut">(first day of one period to the first day of the next)</span></p><div class="row" style="justify-content:flex-start"><input type="number" id="cl" min="15" max="60" value="${usualCycle()}" style="${NUMST}"><span>days</span></div>
 <p class="sm" style="margin:16px 0 6px">How many days does your period usually last?</p><div class="row" style="justify-content:flex-start"><input type="number" id="pl" min="1" max="14" value="${usualLen()}" style="${NUMST}"><span>days</span></div>
 <p class="sm" style="margin:16px 0 6px">When did your last period start? <span class="mut">(optional)</span></p><input type="date" id="ls" style="${NUMST};width:auto">
 <label class="sm" style="display:flex;gap:8px;align-items:center;margin-top:16px"><input type="checkbox" id="irr" ${S.irregular?"checked":""}> My cycle is irregular or I’m not sure</label></div>`];
 return `<div class="ob"><div class="box"><div class="dots">${Array.from({length:tot},(_,i)=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div>${B[st]}<div class="row">${st?`<button class="btn ghost" data-a="back">Back</button>`:"<span></span>"}<button class="btn" data-a="next">${st===tot-1?"Create my space":"Continue"}</button></div></div></div>`}
// ===================== RENDERING =====================
// route — the page currently shown, read from the URL hash (e.g. "#planner"). Defaults to "home".
let route=(location.hash.slice(1)||"home");if(!V[route])route="home";
// NAV — navigation buttons: [page name, icon, label].
const NAV=[["home","🏡","Home"],["planner","🍽️","Planner"],["ai","✨","Ask HER AI"],["library","🌱","Library"],["health","🌸","My Health"]];
// render() — saves S, then rebuilds the whole screen: nav + current page (+ onboarding if unfinished).
//   h  — the full HTML being built.
//   m  — the chat message list (if on the AI page); scrolled to the newest message.
//   nm — the name box in onboarding; focused so the user can type straight away.
function render(){save();let h=`<div class="app"><nav><div class="logo"><b>HER<span style="color:var(--acc)">space</span></b><i>Your space. Your health. Your choices.</i></div>${NAV.map(n=>`<button class="${route===n[0]?"on":""}" data-go="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join("")}</nav><main>${V[route]()}</main></div>`;if(!S.onb||!S.name)h+=onb();$("#root").innerHTML=h;const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight;const nm=$("#nm");if(nm&&!nm.value)nm.focus()}
// modal(id) — opens the recipe pop-up for meal id. m — that meal. d — the dark backdrop;
// clicking the backdrop (outside the sheet) closes it.
function modal(id){const m=M.find(x=>x.id===id);const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="sheet">${tile(m)}<div class="row" style="margin-top:10px"><h2 style="margin:0">${m.n}</h2><button data-a="close" style="font-size:22px">✕</button></div><p class="sm mut">${m.t} · ${m.k} kcal · ${m.p} g protein · ${m.i} mg iron · ${m.f} g fiber</p><b>Ingredients</b><ul>${m.ing.map(i=>`<li>${i}</li>`).join("")}</ul><b>Preparation</b><ol>${m.st.map(i=>`<li>${i}</li>`).join("")}</ol><button class="btn" data-a="save" data-v="${m.id}" data-keep="1">${S.saved.includes(m.id)?"♥ Saved":"♡ Save recipe"}</button></div>`;d.addEventListener("click",e=>{if(e.target===d)d.remove()});document.body.appendChild(d)}
// tg(a, v) — "toggle": adds v to list a if missing, removes it if present (used for chips like allergies).
const tg=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
// send(t) — adds the user's chat message t, then half a second later adds the assistant's reply.
function send(t){t=(t||"").trim();if(!t)return;S.chat.push({r:"u",t});render();setTimeout(()=>{S.chat.push({r:"a",t:reply(t)||"I can build a recipe from what’s in your fridge, or answer nutrition questions. Try “I have chickpeas and spinach”."});render()},500)}
// ===================== EVENT HANDLING =====================
// One click listener handles every button in the app.
//   g — a clicked element with data-go="page": switches page.
//   b — a clicked element with data-a="action"; a = that action name, v = its data-v value.
// Most actions change S and then fall through to render() at the end.
//   swap: p = suitable meals, c = current meal, n = the next one in the list (wraps round).
//   copy: tx = the grocery list as plain text for the clipboard.
//   next (onboarding): n = name box, d = dislikes box; checks answers, then moves to the next
//         question, or finishes on the last one (step 4) and resets today's plan.
//         On the cycle question: cl/pl/ls/irr = its inputs; the answers are checked and saved, and a
//         last-period date (if given) is logged for the usual number of days.
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){route=g.dataset.go;location.hash=route;render();window.scrollTo(0,0);return}
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="close"){b.closest(".modal").remove();return}
 if(a==="open"){modal(+v);return}
 if(a==="save"){tg(S.saved,+v);toast(S.saved.includes(+v)?"Saved ♥ — find it in Planner › Saved":"Removed from saved");if(b.dataset.keep){b.textContent=S.saved.includes(+v)?"♥ Saved":"♡ Save recipe";save();return}}
 else if(a==="swap"){const p=pool(v),c=cur(v),n=p[(p.indexOf(c)+1)%p.length];S.plan[v]=n.id;toast("Swapped to "+n.n)}
 else if(a==="water")S.water=Math.min(12,S.water+1);else if(a==="waterm")S.water=Math.max(0,S.water-1);
 // mood / sym: save a mood (tap again to clear) or toggle a symptom for the day in data-d (default today).
 else if(a==="mood"){const L=dayLog(b.dataset.d||TODAY);L.mood=L.mood===v?"":v}else if(a==="tab")S.tab=v;
 else if(a==="diet"){S.diet=v;S.dpick=true}else if(a==="al")tg(S.al,v);else if(a==="cook")S.cook=v;else if(a==="skill")S.skill=v;
 else if(a==="sym")tg(dayLog(b.dataset.d||TODAY).sym,v);
 // usetoday: put a saved recipe into today's plan for its slot (only if it fits the user's diet/allergies).
 else if(a==="usetoday"){const m=M.find(x=>x.id===+v);if(!ok(m)){toast("That one doesn’t match your current diet or allergies");return}S.plan[m.s]=m.id;toast("Added to today’s "+m.s)}
 // ---- Period tracker actions ----
 // day: tap any calendar day (v = "YYYY-MM-DD") to select it; the panel below the calendar then edits it.
 else if(a==="day"){S.sel=v;const p=v.split("-").map(Number);S.calY=p[0];S.calM=p[1]-1}
 // calnav: move the calendar one month back (v = -1) or forward (v = 1), wrapping the year.
 else if(a==="calnav"){S.calM+=+v;if(S.calM<0){S.calM=11;S.calY--}else if(S.calM>11){S.calM=0;S.calY++}}
 // logtoday: "I have my period today" — adds today (or removes it if already logged).
 else if(a==="logtoday"){tg(S.period,TODAY);toast(S.period.includes(TODAY)?"Period logged for today 🩸":"Removed today’s log")}
 // uselog: copy the averages from the user's own logs into the two boxes.
 else if(a==="uselog"){const c=cycle();if(c.logCycle)S.cycleLen=c.logCycle;if(c.logLen)setPeriodLen(c.logLen);toast("Using your logged averages")}
 // pday: mark/unmark the selected day as a period day (past or future).
 else if(a==="pday")tg(S.period,S.sel);
 // pstart: log a whole period starting on the selected day, `len` days long (average or usual length).
 else if(a==="pstart"){const len=usualLen();for(let i=0;i<len;i++){const d=addDays(S.sel,i);if(!S.period.includes(d))S.period.push(d)}toast(`Period logged: ${nice(S.sel)} + ${len-1} days 🩸`)}
 // clearperiods: wipe all period history (asks first).
 else if(a==="clearperiods"){if(!confirm("Delete all logged period days? This can’t be undone."))return;S.period=[]}
 else if(a==="ask"){send(v);return}else if(a==="send"){const q=$("#q");send(q.value);return}
 else if(a==="ptab"){S.ptab=v;if(v==="shop"&&!Object.keys(groceries()).length)fill()}else if(a==="day2")S.day=v;else if(a==="autofill"){fill();S.ptab="week";toast("Week planned 🌿")}else if(a==="clearwk")S.week={};else if(a==="clearGot")S.got=[];
 else if(a==="copy"){const g=groceries();const tx="HERspace grocery list\n"+Object.entries(g).map(([c,it])=>"\n"+c+"\n"+it.map(([i,k])=>"- "+i+(k>1?" x"+k:"")).join("\n")).join("\n");try{navigator.clipboard.writeText(tx);toast("List copied")}catch(err){toast("Couldn’t copy")}}
 else if(a==="redo"){S.onb=false;S.step=0}
 else if(a==="back")S.step--;
 else if(a==="next"){const n=$("#nm"),d=$("#dl");if(n&&!n.value.trim()){toast("Please tell us your name 💜");n.focus();return}if(S.step===1&&!S.dpick){toast("Please choose how you eat 🌿");return}if(n)S.name=n.value.trim();if(d)S.dis=d.value.trim();
  const cl=$("#cl"),pl=$("#pl"),ls=$("#ls"),irr=$("#irr");
  if(cl){const cv=Math.round(+cl.value),pv=Math.round(+pl.value);if(!(cv>=15&&cv<=60)){toast("Cycle length should be 15–60 days");return}if(!(pv>=1&&pv<=14)){toast("Period length should be 1–14 days");return}
   S.cycleLen=cv;S.periodLen=pv;S.irregular=irr.checked;if(ls.value)for(let i=0;i<pv;i++){const x=addDays(ls.value,i);if(!S.period.includes(x))S.period.push(x)}}
  if(S.step===4){S.onb=true;S.plan={breakfast:0,lunch:0,dinner:0,snack:0};route="home";location.hash="home"}else S.step++}
 render()});
// applySet(t) — reads a tracker number box (data-set="cycleLen" / "periodLen"). If the value is within
// its limits (lo–hi) it's saved — period length also resizes the latest period — and the page is redrawn
// with the cursor put back in the same box, so you can keep typing or clicking the arrows.
// Returns false if the value is out of range (nothing changes).
function applySet(t){const lo=+t.min,hi=+t.max,n=Math.round(+t.value),k=t.dataset.set;
 if(!(n>=lo&&n<=hi))return false;
 if(S[k]!==n||(k==="cycleLen"&&!S.cycleLen)||(k==="periodLen"&&!S.periodLen)){if(k==="periodLen")setPeriodLen(n);else S[k]=n;render();
  const f=document.querySelector(`[data-set="${k}"]`);if(f)f.focus()}
 return true}
// "input" fires on every keystroke or arrow click, so the calendar updates while you type.
document.addEventListener("input",e=>{if(e.target.dataset.set)applySet(e.target)});
// "change" listener: t — the changed element. A meal dropdown (data-sel) sets that slot for the
// selected day; a grocery checkbox (data-got) ticks or unticks that item; a tracker number box that was
// left with an out-of-range value shows a message and snaps back to the saved value.
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.set){if(!applySet(t)){toast(`Please enter ${t.min}–${t.max} days`);render()}}else if(t.dataset.sel){(S.week[S.day]=S.week[S.day]||{})[t.dataset.sel]=+t.value||0;render()}else if(t.dataset.got){tg(S.got,t.dataset.got);render()}});
// Enter key: in the name box it presses Continue; in the chat box it sends the message.
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nm")document.querySelector('[data-a="next"]').click();if(e.key==="Enter"&&e.target.id==="q"){send(e.target.value)}});
// Browser back/forward changes the #hash; r — the new page name. Show it if it exists.
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(V[r]&&r!==route){route=r;render()}});
render();
    </script>
