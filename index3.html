<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HERspace — Your space. Your health. Your choices.</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
         :root {
            --blush: #F7E8EE;
            --cream: #FFF9F3;
            --lav: #E9E2F5;
            --sage: #DCE9DD;
            --plum: #3E1F47;
            --mut: #7A6580;
            --card: #fff;
            --line: #eddde5;
            --acc: #8B4A7A;
            --acc2: #F3D3E1;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light
        }
        
        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --blush: #3a2335;
                --cream: #1f1521;
                --lav: #332a47;
                --sage: #26352b;
                --plum: #f5e6ef;
                --mut: #bba6c2;
                --card: #2a1d2d;
                --line: #41304a;
                --acc: #e4a8cf;
                --acc2: #4a2d44;
                color-scheme: dark
            }
        }
        
        :root[data-theme="dark"] {
            --blush: #3a2335;
            --cream: #1f1521;
            --lav: #332a47;
            --sage: #26352b;
            --plum: #f5e6ef;
            --mut: #bba6c2;
            --card: #2a1d2d;
            --line: #41304a;
            --acc: #e4a8cf;
            --acc2: #4a2d44;
            color-scheme: dark
        }
        
        * {
            box-sizing: border-box
        }
        
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }
        
        body {
            margin: 0;
            background: var(--cream);
            color: var(--plum);
            font: 15px/1.55 Inter, system-ui, sans-serif
        }
        
        h1,
        h2,
        h3,
        .serif {
            font-family: Fraunces, Georgia, serif;
            font-weight: 400;
            margin: 0;
            letter-spacing: -.01em
        }
        
        button {
            font: inherit;
            color: inherit;
            cursor: pointer;
            border: 0;
            background: none
        }
        
        .app {
            display: flex;
            min-height: 100vh
        }
        
        nav {
            position: fixed;
            z-index: 20;
            background: var(--card);
            border-top: 1px solid var(--line);
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px))
        }
        
        nav .logo {
            display: none
        }
        
        nav button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: var(--mut);
            padding: 6px 8px;
            border-radius: 14px;
            flex: 1
        }
        
        nav button span {
            font-size: 19px
        }
        
        nav button.on {
            color: var(--acc);
            font-weight: 600;
            background: var(--blush)
        }
        
        main {
            flex: 1;
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 18px 110px
        }
        
        @media(min-width:800px) {
            nav {
                top: 0;
                bottom: auto;
                right: auto;
                width: 220px;
                flex-direction: column;
                justify-content: flex-start;
                gap: 6px;
                border-top: 0;
                border-right: 1px solid var(--line);
                padding: 28px 14px;
                height: 100vh
            }
            nav .logo {
                display: block;
                margin: 0 10px 22px
            }
            nav button {
                flex-direction: row;
                gap: 12px;
                font-size: 14px;
                padding: 11px 14px;
                flex: 0;
                justify-content: flex-start
            }
            main {
                margin-left: 220px;
                max-width: none;
                padding: 36px 44px 60px
            }
            .app>main {
                max-width: 1100px
            }
        }
        
        .logo b {
            font: 600 26px Fraunces, serif;
            display: block
        }
        
        .logo i {
            font-size: 11px;
            color: var(--mut);
            font-style: normal
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 18px
        }
        
        .grid {
            display: grid;
            gap: 14px
        }
        
        .g2 {
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr))
        }
        
        .g3 {
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr))
        }
        
        .hero {
            background: linear-gradient(135deg, var(--blush), var(--lav));
            border-radius: 28px;
            padding: 26px;
            margin-bottom: 14px
        }
        
        .hero h1 {
            font-size: clamp(28px, 5vw, 40px);
            line-height: 1.15
        }
        
        .mut {
            color: var(--mut)
        }
        
        .sm {
            font-size: 12.5px
        }
        
        .btn {
            background: var(--plum);
            color: var(--cream);
            padding: 11px 20px;
            border-radius: 999px;
            font-weight: 500
        }
        
        .btn.ghost {
            background: var(--acc2);
            color: var(--plum)
        }
        
        .btn.sm {
            padding: 7px 14px;
            font-size: 13px
        }
        
        h2 {
            font-size: 24px;
            margin: 22px 0 12px
        }
        
        .chip {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--line);
            margin: 3px 4px 3px 0;
            font-size: 13.5px
        }
        
        .chip.on {
            background: var(--plum);
            color: var(--cream);
            border-color: var(--plum)
        }
        
        .tile {
            height: 130px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: grid;
            place-items: center;
            font-size: 58px
        }
        
        .tile:before,
        .tile:after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .4)
        }
        
        .tile:before {
            width: 150px;
            height: 150px;
            right: -40px;
            top: -50px
        }
        
        .tile:after {
            width: 90px;
            height: 90px;
            left: -25px;
            bottom: -35px
        }
        
        .tile span {
            position: relative;
            filter: drop-shadow(0 6px 8px rgba(62, 31, 71, .25))
        }
        
        .meal {
            cursor: pointer;
            padding: 12px;
            transition: transform .15s
        }
        
        .meal:hover {
            transform: translateY(-3px)
        }
        
        .meal h3 {
            font-size: 18px;
            margin: 10px 0 2px
        }
        
        .tag {
            font-size: 11px;
            background: var(--sage);
            color: #2f4a35;
            border-radius: 99px;
            padding: 2px 9px;
            margin-right: 4px
        }
        
        @media(prefers-color-scheme:dark) {
            .tag {
                color: #cfe6d3
            }
        }
        
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap
        }
        
        .bar {
            height: 8px;
            background: var(--line);
            border-radius: 9px;
            overflow: hidden;
            margin: 5px 0 12px
        }
        
        .bar i {
            display: block;
            height: 100%;
            background: var(--acc);
            border-radius: 9px
        }
        
        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px
        }
        
        .tabs .chip {
            white-space: nowrap
        }
        
        .slot {
            font: 600 11px Inter;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--acc);
            margin: 18px 0 8px
        }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(40, 16, 48, .5);
            z-index: 50;
            display: flex;
            align-items: flex-end;
            justify-content: center
        }
        
        .modal .sheet {
            background: var(--cream);
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow: auto;
            border-radius: 28px 28px 0 0;
            padding: 18px;
            padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px))
        }
        
        @media(min-width:800px) {
            .modal {
                align-items: center
            }
            .modal .sheet {
                border-radius: 28px
            }
        }
        
        .sheet ol,
        .sheet ul {
            padding-left: 20px;
            margin: 6px 0
        }
        
        .chat {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 330px);
            min-height: 380px
        }
        
        .msgs {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px
        }
        
        .m {
            max-width: 85%;
            padding: 11px 15px;
            border-radius: 20px;
            white-space: pre-wrap
        }
        
        .m.u {
            align-self: flex-end;
            background: var(--plum);
            color: var(--cream);
            border-bottom-right-radius: 6px
        }
        
        .m.a {
            background: var(--lav);
            border-bottom-left-radius: 6px
        }
        
        .inp {
            display: flex;
            gap: 8px;
            margin-top: 10px
        }
        
        input[type=text],
        textarea {
            flex: 1;
            font: inherit;
            color: var(--plum);
            padding: 12px 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            width: 100%
        }
        
        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center
        }
        
        .cal button {
            aspect-ratio: 1;
            border-radius: 14px;
            background: var(--blush);
            font-size: 13px
        }
        
        .cal button.p {
            background: #c4507f;
            color: #fff
        }
        
        .cal button.t {
            outline: 2px solid var(--plum)
        }
        
        .cal b {
            font-size: 11px;
            color: var(--mut)
        }
        
        .ob {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: linear-gradient(160deg, var(--blush), var(--cream) 50%, var(--lav));
            overflow: auto;
            display: grid;
            place-items: center;
            padding: 20px
        }
        
        .ob .box {
            max-width: 520px;
            width: 100%
        }
        
        .dots {
            display: flex;
            gap: 6px;
            margin-bottom: 22px
        }
        
        .dots i {
            height: 4px;
            flex: 1;
            border-radius: 4px;
            background: var(--line)
        }
        
        .dots i.on {
            background: var(--plum)
        }
        
        .ob h1 {
            font-size: 32px;
            margin-bottom: 8px
        }
        
        .ob .opts {
            margin: 18px 0
        }
        
        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 90px;
            background: var(--plum);
            color: var(--cream);
            padding: 10px 18px;
            border-radius: 99px;
            z-index: 70;
            font-size: 13px
        }
    </style>
</head>

let route=(location.hash.slice(1)||"home");if(!V[route])route="home";
const NAV=[["home","🏡","Home"],["planner","🍽️","Planner"],["ai","✨","Ask HER AI"],["library","🌱","Library"],["health","🌸","My Health"]];
function render(){save();let h=`<div class="app"><nav><div class="logo"><b>HER<span style="color:var(--acc)">space</span></b><i>Your space. Your health. Your choices.</i></div>${NAV.map(n=>`<button class="${route===n[0]?"on":""}" data-go="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join("")}</nav><main>${V[route]()}</main></div>`;if(!S.onb||!S.name)h+=onb();$("#root").innerHTML=h;const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight;const nm=$("#nm");if(nm&&!nm.value)nm.focus()}
function modal(id){const m=M.find(x=>x.id===id);const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="sheet">${tile(m)}<div class="row" style="margin-top:10px"><h2 style="margin:0">${m.n}</h2><button data-a="close" style="font-size:22px">✕</button></div><p class="sm mut">${m.t} · ${m.k} kcal · ${m.p} g protein · ${m.i} mg iron · ${m.f} g fiber</p><b>Ingredients</b><ul>${m.ing.map(i=>`<li>${i}</li>`).join("")}</ul><b>Preparation</b><ol>${m.st.map(i=>`<li>${i}</li>`).join("")}</ol><button class="btn" data-a="save" data-v="${m.id}" data-keep="1">${S.saved.includes(m.id)?"♥ Saved":"♡ Save recipe"}</button></div>`;d.addEventListener("click",e=>{if(e.target===d)d.remove()});document.body.appendChild(d)}
const tg=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
function send(t){t=(t||"").trim();if(!t)return;S.chat.push({r:"u",t});render();setTimeout(()=>{S.chat.push({r:"a",t:reply(t)||"I can build a recipe from what’s in your fridge, or answer nutrition questions. Try “I have chickpeas and spinach”."});render()},500)}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){route=g.dataset.go;location.hash=route;render();window.scrollTo(0,0);return}
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="close"){b.closest(".modal").remove();return}
 if(a==="open"){modal(+v);return}
 if(a==="save"){tg(S.saved,+v);toast(S.saved.includes(+v)?"Saved to your recipes ♥":"Removed from saved");if(b.dataset.keep){b.textContent=S.saved.includes(+v)?"♥ Saved":"♡ Save recipe";save();return}}
 else if(a==="swap"){const p=pool(v),c=cur(v),n=p[(p.indexOf(c)+1)%p.length];S.plan[v]=n.id;toast("Swapped to "+n.n)}
 else if(a==="water")S.water=Math.min(12,S.water+1);else if(a==="waterm")S.water=Math.max(0,S.water-1);
 else if(a==="mood")S.mood=v;else if(a==="tab")S.tab=v;
 else if(a==="diet")S.diet=v;else if(a==="al")tg(S.al,v);else if(a==="goal")tg(S.goals,v);else if(a==="cook")S.cook=v;else if(a==="skill")S.skill=v;
 else if(a==="sym")tg(S.sym,v);else if(a==="day")tg(S.period,key(+v));
 else if(a==="ask"){send(v);return}else if(a==="send"){const q=$("#q");send(q.value);return}
 else if(a==="ptab"){S.ptab=v;if(v==="shop"&&!Object.keys(groceries()).length)fill()}else if(a==="day2")S.day=v;else if(a==="autofill"){fill();S.ptab="week";toast("Week planned 🌿")}else if(a==="clearwk")S.week={};else if(a==="clearGot")S.got=[];
 else if(a==="copy"){const g=groceries();const tx="HERspace grocery list\n"+Object.entries(g).map(([c,it])=>"\n"+c+"\n"+it.map(([i,k])=>"- "+i+(k>1?" x"+k:"")).join("\n")).join("\n");try{navigator.clipboard.writeText(tx);toast("List copied")}catch(err){toast("Couldn’t copy")}}
 else if(a==="redo"){S.onb=false;S.step=0}
 else if(a==="back")S.step--;
 else if(a==="next"){const n=$("#nm"),d=$("#dl");if(n&&!n.value.trim()){toast("Please tell us your name 💜");n.focus();return}if(n)S.name=n.value.trim();if(d)S.dis=d.value.trim();if(S.step===5){S.onb=true;S.plan={breakfast:0,lunch:0,dinner:0,snack:0};route="home";location.hash="home"}else S.step++}
 render()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.sel){(S.week[S.day]=S.week[S.day]||{})[t.dataset.sel]=+t.value||0;render()}else if(t.dataset.got){tg(S.got,t.dataset.got);render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nm")document.querySelector('[data-a="next"]').click();if(e.key==="Enter"&&e.target.id==="q"){send(e.target.value)}});
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(V[r]&&r!==route){route=r;render()}});
render();
    </script>
</body>

</html>
